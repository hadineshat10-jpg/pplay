name: Build PS4 PKG

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install toolchain (OpenOrbis via pacbrew)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git zip curl wget clang lld
          wget https://github.com/PacBrew/pacbrew-pacman/releases/download/pacbrew-release-1.0/pacbrew-pacman-1.0.deb
          sudo dpkg -i pacbrew-pacman-1.0.deb
          sudo pacbrew-pacman --noconfirm -Syu
          sudo pacbrew-pacman --noconfirm -S ps4-openorbis ps4-openorbis-portlibs

      - name: Configure
        run: |
          export OPENORBIS=/opt/pacbrew/ps4/openorbis
          mkdir cmake-build-release
          cd cmake-build-release
          cmake -G "Unix Makefiles" -DPLATFORM_PS4=ON -DCMAKE_BUILD_TYPE=Release ../

      - name: List package targets
        run: |
          cd cmake-build-release
          make help | grep -i pkg || true

      - name: Build pkg
        run: |
          export OPENORBIS=/opt/pacbrew/ps4/openorbis
          cd cmake-build-release
          make -j4 pplay_pkg

      - name: Upload pkg
        uses: actions/upload-artifact@v4
        with:
          name: pplay-ps4
          path: cmake-build-release/**/*.pkg
