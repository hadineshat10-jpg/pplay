name: Build PS4 PKG

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Create dummy TMDB key (needed by cmake, not used for playback)
        run: echo "0000000000000000" > pscrap/tmdb.key

      - name: Pull prebuilt PS4 toolchain image
        run: docker pull xfangfang/pacbrew:latest

      - name: Configure
        run: |
          docker run --rm -v "$PWD":/src xfangfang/pacbrew:latest \
            "export OPENORBIS=/opt/pacbrew/ps4/openorbis && cd /src && mkdir -p cmake-build-release && cd cmake-build-release && cmake -G 'Unix Makefiles' -DPLATFORM_PS4=ON -DCMAKE_BUILD_TYPE=Release ../"

      - name: List package targets
        run: |
          docker run --rm -v "$PWD":/src xfangfang/pacbrew:latest \
            "export OPENORBIS=/opt/pacbrew/ps4/openorbis && cd /src/cmake-build-release && make help | grep -i pkg || true"

      - name: Build pkg
        run: |
          docker run --rm -v "$PWD":/src xfangfang/pacbrew:latest \
            "export OPENORBIS=/opt/pacbrew/ps4/openorbis && cd /src/cmake-build-release && make -j4 pplay_pkg"

      - name: Upload pkg
        uses: actions/upload-artifact@v4
        with:
          name: pplay-ps4
          path: cmake-build-release/**/*.pkg
